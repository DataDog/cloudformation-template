name: Python tests

on:
  push:
    paths:
      - "**.py"
      - "aws_terraform_wif/release.sh"
      - "aws_terraform_wif/version.txt"
      - "aws_quickstart/main_workflow.yaml"
      - "aws_quickstart/main_extended_workflow.yaml"
      - "aws_quickstart/main_agent_installation.yaml"
      - "aws_quickstart/datadog_agent_resource_update_forwarding.yaml"
      - "aws_quickstart/datadog_integration_role.yaml"
      - "aws_quickstart/datadog_integration_permissions.yaml"
      - "aws_quickstart/datadog_agentless_saas_policy.json"
      - "aws_quickstart/release.sh"
  pull_request:
    paths:
      - "**.py"
      - "aws_terraform_wif/release.sh"
      - "aws_terraform_wif/version.txt"
      - "aws_quickstart/main_workflow.yaml"
      - "aws_quickstart/main_extended_workflow.yaml"
      - "aws_quickstart/main_agent_installation.yaml"
      - "aws_quickstart/datadog_agent_resource_update_forwarding.yaml"
      - "aws_quickstart/datadog_integration_role.yaml"
      - "aws_quickstart/datadog_integration_permissions.yaml"
      - "aws_quickstart/datadog_agentless_saas_policy.json"
      - "aws_quickstart/release.sh"

jobs:
  agentless_api_call_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run Agentless API Call unit tests
        run: |
          cd aws_quickstart
          python -B -S -m unittest datadog_agentless_api_call_test.py -v
      - name: Run integration permissions unit tests
        run: |
          cd aws_quickstart
          python -B -S -m unittest attach_integration_permissions_test.py -v
      - name: Run shared CloudFormation helper unit tests
        run: |
          cd aws_quickstart
          python -B -S -m unittest cfn_common_test.py -v
      - name: Run workflow status logging unit tests
        run: |
          cd aws_quickstart
          python -B -S -m unittest workflow_status_logging_test.py -v
      - name: Run Operator subscription unit tests
        run: |
          cd aws_quickstart
          python -B -S -m unittest accept_operator_subscription_test.py -v
      - name: Run Agentless workflow template tests
        run: |
          python -m pip install PyYAML
          cd aws_quickstart
          python -B -m unittest agentless_workflow_test.py -v

  terraform_wif_provider_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        terraform: ['1.10.5', '1.16.6']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - name: Download signed provider releases for the isolated test
        env:
          CHECKPOINT_DISABLE: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/wif-provider-seed"
          cat > "$RUNNER_TEMP/wif-provider-seed/main.tf" <<'HCL'
          terraform {
            required_providers {
              aws = {
                source = "hashicorp/aws"
                version = "= 6.72.0"
              }
              datadog = {
                source = "DataDog/datadog"
                version = "= 4.29.0"
              }
            }
          }
          HCL
          terraform -chdir="$RUNNER_TEMP/wif-provider-seed" init -backend=false -input=false -no-color
      - name: Verify PAT-to-WIF transition with real providers and fake services
        run: |
          export TERRAFORM_WIF_INTEGRATION_BINARY="$(command -v terraform)"
          export TERRAFORM_WIF_PROVIDER_MIRROR="$RUNNER_TEMP/wif-provider-seed/.terraform/providers"
          cd aws_terraform_wif
          python -B -m unittest terraform_wif_bootstrap_test release_test terraform_wif_provider_integration_test -v
